_format_version: "3.0"

services:
  - name: user-service
    url: grpc://user-service:50051
    routes:
      - name: user-service-grpc
        protocols:
          - grpc
        paths:
          - /user.UserService

  - name: trip-service
    url: grpc://trip-service:50052
    routes:
      - name: trip-service-grpc
        protocols:
          - grpc
        paths:
          - /trip.TripService

  - name: driver-service
    url: grpc://driver-service:50053
    routes:
      - name: driver-service-grpc
        protocols:
          - grpc
        paths:
          - /driver.DriverService

  - name: notification-service
    url: grpc://notification-service:50054
    routes:
      - name: notification-service-grpc
        protocols:
          - grpc
        paths:
          - /notification.NotificationService
