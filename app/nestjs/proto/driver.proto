syntax = "proto3";

package driver;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "trip.proto";

service DriverService {
  rpc GetAllTripsOfDriver(GetAllTripsOfDriverRequest) 
    returns (GetAllTripsOfDriverResponse);
  rpc UpdateDriverStatusGrpc(UpdateDriverStatusGrpcRequest)
    returns (UpdateDriverStatusGrpcResponse);
  rpc UpdateDriverApproval(UpdateDriverApprovalRequest)
    returns (UpdateDriverApprovalResponse);
  rpc GetDriverApprovals(GetDriverApprovalsRequest)
    returns (GetDriverApprovalsResponse);
  rpc GetLocationOfDriver(GetLocationOfDriverRequest)
    returns (DriverLocation); 
  rpc GetDriverInfoDetailById(GetDriverInfoDetailByIdRequest)
    returns (DriverInfo);
  rpc FindAvailableDrivers(FindAvailableDriversRequest)
    returns (FindAvailableDriversResponse);
}

message NearbyDriver {
  string driver_id = 1;
  double lat = 2;
  double lng = 3;
  double distance_km = 4;
  optional VehicleCached vehicle = 5;
}

message FindAvailableDriversRequest {
  double lat = 1;
  double lng = 2;
}

message FindAvailableDriversResponse {
  int32 count = 1;
  repeated NearbyDriver drivers = 2;
}

message GetDriverInfoDetailByIdRequest {
  string driver_id = 1;
}

message GetLocationOfDriverRequest {
  string driver_id = 1;
}

message GetLocationOfDriverRespose {

}

message GetDriverApprovalsRequest {
  optional string status = 1;
}

message GetDriverApprovalsResponse {
  repeated GetDriverApprovalsFormatted approvals = 1;
}

message GetDriverApprovalsFormatted {
  string driver_approval_id = 1;
  string status = 2;
  google.protobuf.Timestamp reviewed_date = 3;
  optional string note = 4;
  string driver_id = 5;
  string vehicle_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message UpdateDriverApprovalRequest {
  string status = 1;
  optional string note = 2;
  string driver_approval_id = 3;
}

message UpdateDriverApprovalData {
  string driver_approval_id = 1;
  string status = 2;
  google.protobuf.Timestamp reviewed_date = 3;
  optional string note = 4;
  string driver_id = 5;
  string vehicle_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message UpdateDriverApprovalResponse {
  string message = 1;
  UpdateDriverApprovalData data = 2;
}

message UpdateDriverStatusGrpcRequest {
  string status = 1;
  string driver_id = 2;
  optional string current_location = 3;
  optional string current_trip_id = 4;
}

message UpdateDriverStatusGrpcResponse {
  string message = 1;
  google.protobuf.Struct data = 2;
}

message GetAllTripsOfDriverRequest {
  optional string after_cursor = 1;
}

message GetAllTripsOfDriverResponse {
  optional string after_cursor = 1;
  repeated trip.Trip data = 2;
}

message Driver {
  string driver_id = 1;
  string user_id = 2;
  double rating = 3;
  int32 total_trip = 4;
  string license_number = 5;
  google.protobuf.Timestamp license_expiry = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message DriverApproval {
  string driver_approval_id = 1;
  string status = 2;
  google.protobuf.Timestamp reviewed_date = 3;
  optional string note = 4;
  string driver_id = 5;
  string vehicle_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message DriverLocation {
  string hash_prefix = 1;
  string driver_id = 2;
  string geo_hash = 3;
  double lat = 4;
  double lng = 5;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message VehicleCached {
  string vehicle_id = 1;
  string plate_number = 2;
  string brand = 3;
  string model = 4;
  string color = 5;
}

message DriverStatusModel {
  string driver_id = 1;
  string status = 2;
  google.protobuf.Timestamp last_seen_at = 3;
  string current_trip_id = 4;
  VehicleCached vehicle_cached = 5;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Vehicle {
  string vehicle_id = 1;
  string driver_id = 2;
  string plate_number = 3;
  string brand = 4;
  string model = 5;
  string color = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message DriverInfo {
  string driver_id = 1;
  string user_id = 2;
  double rating = 3;
  int32 total_trip = 4;
  string license_number = 5;
  google.protobuf.Timestamp license_expiry = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  DriverStatusModel driver_status = 9;
  DriverApproval driver_approval = 10;
  DriverLocation driver_location = 11;
  Vehicle vehicle = 12;
}