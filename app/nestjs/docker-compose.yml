services:
  kong-database:
    image: postgres:15
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_password
      POSTGRES_DB: kong
    networks:
      - backend
    volumes:
      - kong_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      retries: 5
      start_period: 5s

  kong:
    build:
      context: ../kong
    container_name: kong
    networks:
      - backend
    depends_on:
      kong-database:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "kong-database"
      KONG_PG_PORT: 5432
      KONG_PG_USER: "kong"
      KONG_PG_PASSWORD: "kong_password"
      KONG_PG_DATABASE: "kong"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: "bundled,jwt"
    volumes:
      - ../kong/kong.yml:/tmp/kong.yml
      - ../kong/entrypoint.sh:/docker-entrypoint.sh
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

  user-service:
    build:
      context: .
      dockerfile: ./apps/user/Dockerfile
      secrets:
        - dotenv_key
    image: uit_go-user_service
    container_name: user-service
    ports:
      - "3001:3001"
    secrets:
      - dotenv_key
    depends_on:
      - user-db
      - rabbitmq
    networks:
      - backend

  driver-service:
    build:
      context: .
      dockerfile: ./apps/driver/Dockerfile
      secrets:
        - dotenv_key
    image: uit_go-driver_service
    container_name: driver-service
    environment:
      - AWS_ACCESS_KEY_ID=fake
      - AWS_SECRET_ACCESS_KEY=fake
      - AWS_REGION=local-env
    secrets:
      - dotenv_key
    ports:
      - "3003:3003"
    depends_on:
      - driver-db
      - rabbitmq
    networks:
      - backend

  trip-service:
    build:
      context: .
      dockerfile: ./apps/trip/Dockerfile
      secrets:
        - dotenv_key
    image: uit_go-trip_service
    container_name: trip-service
    secrets:
      - dotenv_key
    ports:
      - "3002:3002"
    depends_on:
      - trip-db
      - rabbitmq
    networks:
      - backend

  user-db:
    image: postgres:15
    container_name: user-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER_DB}
    ports:
      - "5433:5432"
    networks:
      - backend

  driver-db:
    image: amazon/dynamodb-local:latest
    container_name: driver-db
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory -port 8005"
    ports:
      - "8005:8005"
    networks:
      - backend

  trip-db:
    image: mysql:8
    container_name: trip-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TRIP_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_TRIP_USER}
      MYSQL_PASSWORD: ${MYSQL_TRIP_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_TRIP_DATABASE}
    ports:
      - "3307:3306"
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend

  redis:
    image: redis:6.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend

networks:
  backend:
    driver: bridge

secrets:
  dotenv_key:
    file: ./secrets/dotenv_key.txt

volumes:
  kong_pgdata:
