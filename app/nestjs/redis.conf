# ==== Cấu hình cơ bản ====
port 7000          # mỗi node bạn đổi port khác nhau
bind 0.0.0.0       # cho phép kết nối từ tất cả IP
protected-mode no

# ==== Dữ liệu persist ====
dir /data
appendonly yes
appendfilename "appendonly.aof"

# ==== Cluster ====
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage yes

# ==== Logging ====
loglevel notice
logfile ""

# ==== RDB snapshot (vẫn giữ để backup) ====
save 900 1
save 300 10
save 60 10000

# ==== Tối ưu performance ====
tcp-keepalive 60
